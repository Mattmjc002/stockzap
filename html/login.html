<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockZap - Login</title>
    <link rel="stylesheet" href="../css/paginaslogin.css">
</head>
<body>

    <div class="container-login">
        <div class="topo-logo">
            <a href="../stockzap.html">
                <img src="../imagens/StockZap_logo.svg" alt="Logo StockZap">
            </a>
        </div>

        <div class="caixa-login">
            <h2>Acessar Conta</h2>

            <form action="#" method="post" class="form-login">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Sua senha" required>

                <button type="submit" class="botao-login">Entrar</button>
            </form>

            <p class="texto-rodape">
                Ainda não tem conta? <a href="cadastro.html">Criar conta</a>
            </p>
        </div>
    </div>

</body>
</html>
