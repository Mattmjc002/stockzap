<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Autenticando - StockZap</title>

	<link rel="stylesheet" href="../css/base.css">
	<link rel="stylesheet" href="../css/autenticando.css">
</head>

<body>

	<main class="autenticando-main">

		<div class="autenticando-card">

			<img
				src="../imagens/StockZap_logo.svg"
				alt="StockZap"
				class="logo"
			>

			<div class="spinner"></div>

			<h1 id="titulo">Verificando sua conta...</h1>

			<p id="mensagem">
				Aguarde enquanto verificamos sua autenticação.
			</p>

			<button
				id="botaoReenviar"
				class="botao-reenviar"
				style="display: none;"
				onclick="verificarSessao()"
			>
				Tentar novamente
			</button>

		</div>

	</main>


	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="../js/supabase.js"></script>
	<script src="../js/autenticando.js"></script>

</body>
</html>
