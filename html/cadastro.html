<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockZap - Cadastro</title>
    <link rel="stylesheet" href="../css/paginaslogin.css">
</head>
<body>

    <div class="container-login">
        <div class="topo-logo">
            <a href="../stockzap.html">
                <img src="../imagens/StockZap_logo.svg" alt="Logo StockZap">
            </a>
        </div>

        <div class="caixa-login">
            <h2>Criar Conta</h2>

            <form action="#" method="post" class="form-login">
                <label for="nome_user">Seu nome:</label>
                <input type="text" id="nome_user" name="nome_user" placeholder="Digite seu nome" required>

                <label for="nome_empresa">Sua empresa:</label>
                <input type="text" id="nome_empresa" name="nome_empresa" placeholder="Nome da empresa" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

                <button type="submit" class="botao-login">Cadastrar</button>
            </form>

            <p class="texto-rodape">
                Já possui uma conta? <a href="login.html">Entrar</a>
            </p>
        </div>
    </div>

</body>
</html>
